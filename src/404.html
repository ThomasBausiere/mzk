<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Redirecting…</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <script>

      (function () {
        var l = window.location;
        var p = l.pathname + l.search + l.hash;
        l.replace(l.origin + '/?p=' + encodeURIComponent(p));
      })();
    </script>
  </head>
  <body></body>
</html>
