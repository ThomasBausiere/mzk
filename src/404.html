<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Redirecting...</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <script>
      // SPA GitHub Pages redirect
      // Redirects /project/anteos -> /?p=/project/anteos
      (function () {
        var l = window.location;
        var path = l.pathname + l.search + l.hash;
        l.replace(l.origin + l.pathname.split('/').slice(0, 1).join('/') + '/?p=' + encodeURIComponent(l.pathname));
      })();
    </script>
  </head>
  <body></body>
</html>
