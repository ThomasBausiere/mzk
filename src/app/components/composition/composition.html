<section class="composition" [class]="'composition composition--' + composition">

  <!-- Rangée 1 -->
  @if (rows.row1.length) {
    <div class="composition__row composition__row--1">
      @for (item of rows.row1; track item) {
        <figure
          class="composition__media"
          [class.composition__media--embed]="isYouTube(item) || isVimeo(item)"
        >
          <div class="composition__clip">
            @if (isVimeo(item)) {
              @if (!isActive(item)) {
              <button class="composition__poster" type="button" (click)="activate(item)">
                <span class="composition__play" aria-hidden="true"></span>
                <span class="sr-only">Lire la vidéo</span>
              </button>
            } @else {

              <iframe
                class="composition__asset composition__asset--vimeo"
                [src]="vimeoEmbed(item)"
                title="Vimeo video"
                loading="eager"
                referrerpolicy="strict-origin-when-cross-origin"
                allow="fullscreen; picture-in-picture"
                allowfullscreen
              ></iframe>
            } @else if (isYouTube(item)) {
              @if (!isActive(item)) {
                <button class="composition__poster" type="button" (click)="activate(item)">
                  <span class="composition__play" aria-hidden="true"></span>
                  <span class="sr-only">Lire la vidéo</span>
                </button>
              } @else {
              <iframe
                class="composition__asset composition__asset--yt"
                [src]="youtubeEmbed(item)"
                title="YouTube video"
                loading="eager"
                referrerpolicy="strict-origin-when-cross-origin"
                allow="fullscreen; picture-in-picture"
                allowfullscreen
              ></iframe>
            } @else if (isLocalVideo(item)) {
              <video
                class="composition__asset"
                [src]="src(item)"
                playsinline
                preload="metadata"
                controls
              ></video>
            } @else {
              <img class="composition__asset" [src]="src(item)" [alt]="item" />
            }
          </div>
        </figure>
      }
    </div>
  }
