<section class="composition" [class]="'composition composition--' + composition">
  <!-- Rangée 1 -->
  @if (rows.row1.length) {
    <div class="composition__row composition__row--1">
      @for (item of rows.row1; track item) {
        <figure class="composition__media">
          @if (isYouTube(item)) {
  @if (!open.has(item)) {
    <!-- ✅ Overlay clickable -->
    <button
      type="button"
      class="composition__yt-overlay"
      (click)="playYouTube(item)"
      [attr.aria-label]="'Lire la vidéo'"
    >
      <img class="composition__yt-thumb" [src]="youtubeThumb(item)" alt="" />
      <span class="composition__yt-play" aria-hidden="true"></span>
    </button>
  } @else {
    <!-- ✅ Mount point pour l'API YT -->
    <div class="composition__yt-player" [id]="domIdFor(item)"></div>
  }
          } @else if (isLocalVideo(item)) {
            <video
              class="composition__asset"
              [src]="src(item)"
              muted
              loop
              playsinline
              [muted]="true"
              preload="metadata"
            ></video>
          } @else {
            <img class="composition__asset" [src]="src(item)" [alt]="item" />
          }
        </figure>
      }
    </div>
  }

  <!-- Rangée 2 -->
