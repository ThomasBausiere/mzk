<section class="composition" [class]="'composition composition--' + composition">

  <!-- Rangée 1 -->
  @if (rows.row1.length) {
    <div class="composition__row composition__row--1">
      @for (item of rows.row1; track item.index) {
        <figure class="composition__media">
          <div class="composition__clip">
            @if (isYouTube(item.value)) {
              <a
                class="composition__youtube-link"
                [href]="item.value"
                target="_blank"
                rel="noopener noreferrer"
                aria-label="Voir la vidéo sur YouTube"
              >
                <img
                  class="composition__asset composition__asset--thumb"
                  [src]="youtubeThumb(item.index)"
                  [alt]="youtubeAlt(item.index)"
                />
                <span class="composition__play" aria-hidden="true"></span>
              </a>
            } @else if (isLocalVideo(item.value)) {
              <video
                class="composition__asset"
                [src]="src(item.value)"
                playsinline
                preload="metadata"
                controls
              ></video>
            } @else {
              <img
                class="composition__asset"
                [src]="src(item.value)"
                [alt]="item.value"
              /> 
            }
          </div>
        </figure>
      }
    </div>
  }
