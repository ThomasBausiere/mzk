<section class="contact">
  <div class="contact__inner">
    <h1 class="h-display contact__title text-accent">Contact</h1>

    <p class="contact__lead">
      Vous avez une question ou envie de discuter d’une future collaboration ?<br />
      Que ce soit pour échanger sur un projet, poser une question ou simplement dire bonjour,
      je serai ravie de vous lire. N’hésitez pas à me contacter !
    </p>

    <div class="contact__card">
      <form class="contact__form" autocomplete="off">
        <div class="contact__grid">
          <div class="field">
            <label class="field__label" for="name">Nom / Prenom :</label>
            <input class="field__input" id="name" type="text" />
          </div>

          <div class="field">
            <label class="field__label" for="email">E-mail :</label>
            <input class="field__input" id="email" type="email" />
          </div>

          <div class="field field--full">
            <label class="field__label" for="subject">Objet :</label>
            <input class="field__input" id="subject" type="text" />
          </div>

          <div class="field field--full">
            <label class="field__label" for="message">Message :</label>
            <textarea class="field__textarea" id="message" rows="8"></textarea>
          </div>
        </div>

        <div class="contact__submit">
          <button class="btn btn--primary" type="button">Contactez moi</button>
        </div>
      </form>
    </div>
  </div>
</section>
