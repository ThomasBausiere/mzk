<section class="e-trust">
  <div class="e-trust__head">
    <h2 class="h-display e-trust__title text-accent title">Les entreprises qui me font confiance</h2>
    <p class="e-trust__subtitle texts">
      Ensemble, nous avons transformé des idées en projets concrets.
    </p>
  </div>

<div class="e-trust__marquee" aria-label="Logos entreprises">
  <div class="e-trust__track">
    <div class="e-trust__group" aria-hidden="false">
      @for (l of logos; track l.src) {
        <div class="e-trust__logo" [class.is-large]="l.size === 'large'">
          <img [src]="l.src" [alt]="l.alt" />
        </div>
      }
    </div>

    <div class="e-trust__group" aria-hidden="true">
      @for (l of logos; track l.src + '-dup') {
        <div class="e-trust__logo" [class.is-large]="l.size === 'large'">
          <img [src]="l.src" [alt]="l.alt" />
        </div>
      }
    </div>
  </div>
</div>
</section>
