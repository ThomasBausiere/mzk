<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>AMZK Studio</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="mzk.svg">
  <link rel="stylesheet" href="https://use.typekit.net/ozi2fwv.css">
  <link rel="preconnect" href="https://www.youtube-nocookie.com">
<link rel="preconnect" href="https://www.google.com">
<link rel="dns-prefetch" href="https://www.youtube-nocookie.com">
<link rel="dns-prefetch" href="https://www.google.com">
<script>
  (function () {
    var u = new URL(window.location.href);
    var p = u.searchParams.get('p');
    if (!p) return;

    // Nettoie l'URL (retire ?p=...)
    u.searchParams.delete('p');
    window.history.replaceState(null, '', u.pathname + u.search + u.hash);

    // Remet la route demandée et laisse Angular router
    window.history.replaceState(null, '', decodeURIComponent(p));
  })();
</script>

</head>
<body>
  <app-root></app-root>
</body>
</html>
