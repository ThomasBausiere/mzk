<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Mzkpf</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="stylesheet" href="https://use.typekit.net/ozi2fwv.css">
  <link rel="preconnect" href="https://www.youtube-nocookie.com">
<link rel="preconnect" href="https://www.google.com">
<link rel="dns-prefetch" href="https://www.youtube-nocookie.com">
<link rel="dns-prefetch" href="https://www.google.com">
<script>
  (function () {
    // If redirected from 404.html, we have ?p=/some/route
    var seemed = new URL(window.location.href);
    var p = seemed.searchParams.get('p');
    if (p) {
      // clean URL: remove ?p=... then pushState to the intended route
      seemed.searchParams.delete('p');
      window.history.replaceState(null, '', seemed.pathname + seemed.search + seemed.hash);
      window.history.replaceState(null, '', p);
    }
  })();
</script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
